<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate 3D Roblox Obby</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .stats-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 12px 24px;
            color: white;
            font-size: 18px;
            font-weight: 800;
            display: inline-flex;
            gap: 20px;
            align-self: flex-start;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .stat-item { display: flex; align-items: center; gap: 8px; }
        .highlight { color: #ffeb3b; }

        /* 터치 조이스틱 & 버튼 */
        #touch-controls {
            pointer-events: auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 6px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
        .btn:active { background: rgba(255, 255, 255, 0.6); transform: scale(0.95); }
        #btn-jump {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff5722, #f44336);
            border: 4px solid #fff;
            color: white;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.5);
        }

        /* 오버레이 메시지 */
        #msg-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 42px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,235,59,0.8);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
        #msg-overlay.show {
            opacity: 1;
            transform: translate(-50%, -60%) scale(1.1);
        }
    </style>
    <!-- Three.js 3D 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="stats-card">
            <div class="stat-item">STAGE: <span id="stage-val" class="highlight">1 / 5</span></div>
            <div class="stat-item">TIME: <span id="time-val" class="highlight">0.0s</span></div>
        </div>

        <div id="touch-controls">
            <div class="dpad">
                <div></div><div class="btn" id="b-up">▲</div><div></div>
                <div class="btn" id="b-left">◀</div><div></div><div class="btn" id="b-right">▶</div>
                <div></div><div class="btn" id="b-down">▼</div><div></div>
            </div>
            <div class="btn" id="btn-jump">JUMP</div>
        </div>
    </div>

    <div id="msg-overlay">CHECKPOINT!</div>

    <script>
        // ----------------------------------------------------
        // 1. Scene / Camera / Renderer 초기화
        // ----------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 조명
        const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(30, 60, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // ----------------------------------------------------
        // 2. 로블록스 스타일 3D 캐릭터 생성
        // ----------------------------------------------------
        function createRobloxCharacter() {
            const group = new THREE.Group();

            const matHead = new THREE.MeshLambertMaterial({ color: 0xffcc00 }); // 노란 머리
            const matTorso = new THREE.MeshLambertMaterial({ color: 0x0288d1 }); // 파란 몸통
            const matLimbs = new THREE.MeshLambertMaterial({ color: 0x388e3c }); // 초록 다리/팔

            // 머리
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), matHead);
            head.position.y = 1.25;
            head.castShadow = true;
            group.add(head);

            // 몸통
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), matTorso);
            torso.position.y = 0.45;
            torso.castShadow = true;
            group.add(torso);

            // 왼팔 / 오른팔
            const armGeo = new THREE.BoxGeometry(0.35, 0.85, 0.35);
            const leftArm = new THREE.Mesh(armGeo, matHead);
            leftArm.position.set(-0.6, 0.425, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, matHead);
            rightArm.position.set(0.6, 0.425, 0);
            rightArm.castShadow = true;
            group.add(rightArm);

            // 왼다리 / 오른다리
            const legGeo = new THREE.BoxGeometry(0.38, 0.85, 0.38);
            const leftLeg = new THREE.Mesh(legGeo, matLimbs);
            leftLeg.position.set(-0.21, -0.425, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, matLimbs);
            rightLeg.position.set(0.21, -0.425, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);

            return { group, leftArm, rightArm, leftLeg, rightLeg };
        }

        const charObj = createRobloxCharacter();
        const player = charObj.group;
        scene.add(player);

        // ----------------------------------------------------
        // 3. 맵 & 스테이지 구성 (기믹 오브젝트 포함)
        // ----------------------------------------------------
        const platforms = [];
        const rotatingObstacles = [];
        const vanishingPlatforms = [];
        const checkPoints = [];

        let currentRespawnPos = new THREE.Vector3(0, 3, 0);
        let currentStageIndex = 1;

        // 소재
        const matNormal = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
        const matKill = new THREE.MeshLambertMaterial({ color: 0xf44336 }); // 킬 블록
        const matBounce = new THREE.MeshLambertMaterial({ color: 0xffeb3b }); // 점프대
        const matVanishing = new THREE.MeshLambertMaterial({ color: 0x9c27b0, transparent: true, opacity: 1.0 });

        // 발판 생성 함수
        function addPlatform(x, y, z, w, h, d, type = 'normal', stageNum = 1) {
            let mat = matNormal;
            if (type === 'kill') mat = matKill;
            if (type === 'bounce') mat = matBounce;
            if (type === 'vanishing') mat = matVanishing.clone();

            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            const pData = { mesh, x, y, z, w, h, d, type, stageNum, timer: 0, state: 'active' };
            platforms.push(pData);

            if (type === 'vanishing') vanishingPlatforms.push(pData);
            return mesh;
        }

        // 체크포인트 깃발 생성
        function addCheckpoint(x, y, z, stageNum) {
            addPlatform(x, y, z, 6, 1, 6, 'normal', stageNum);

            // 깃대
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
            pole.position.set(x - 2, y + 2.5, z - 2);
            scene.add(pole);

            // 깃발
            const flagMat = new THREE.MeshLambertMaterial({ color: 0xffeb3b });
            const flag = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 0.1), flagMat);
            flag.position.set(x - 1.25, y + 4, z - 2);
            scene.add(flag);

            checkPoints.push({ stageNum, pos: new THREE.Vector3(x, y + 2, z), flagMat, flag });
        }

        // --- 맵 설계 ---
        // Stage 1: 기본 점프
        addCheckpoint(0, 0, 0, 1);
        addPlatform(0, 1, -8, 3, 1, 3);
        addPlatform(0, 2, -15, 3, 1, 3);
        addPlatform(0, 3, -22, 3, 1, 3, 'bounce'); // 점프대

        // Stage 2: 사라지는 발판 & 킬 블록
        addCheckpoint(0, 8, -32, 2);
        addPlatform(0, 8, -40, 3, 1, 3, 'vanishing');
        addPlatform(0, 8, -47, 3, 1, 3, 'vanishing');
        addPlatform(0, 8, -54, 3, 1, 3, 'kill'); // 장애물
        addPlatform(0, 8, -61, 3, 1, 3, 'vanishing');

        // Stage 3: 회전 장애물 구간
        addCheckpoint(0, 8, -72, 3);
        const centerPlatform = addPlatform(0, 8, -82, 8, 1, 8);
        
        // 회전하는 몽둥이
        const spinner = new THREE.Mesh(new THREE.BoxGeometry(7, 0.8, 0.8), matKill);
        spinner.position.set(0, 9.2, -82);
        spinner.castShadow = true;
        scene.add(spinner);
        rotatingObstacles.push(spinner);

        addPlatform(0, 8, -92, 3, 1, 3, 'bounce');

        // Stage 4: 정밀 점프 지대
        addCheckpoint(0, 16, -104, 4);
        addPlatform(-4, 17, -112, 2, 1, 2);
        addPlatform(4, 18, -120, 2, 1, 2);
        addPlatform(0, 19, -128, 2, 1, 2, 'vanishing');

        // Stage 5: 최종 골인 지점
        addCheckpoint(0, 20, -140, 5);

        // ----------------------------------------------------
        // 4. 물리엔진 & 캐릭터 조작
        // ----------------------------------------------------
        let velocity = new THREE.Vector3();
        let isGrounded = false;
        let walkAnimTimer = 0;
        let startTime = Date.now();

        const keys = { up: false, down: false, left: false, right: false };

        // 키보드 컨트롤
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === ' ' && isGrounded) { velocity.y = 0.38; isGrounded = false; }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // 패드/터치 컨트롤
        function bindTouch(id, keyName) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            el.addEventListener('mousedown', () => keys[keyName] = true);
            el.addEventListener('mouseup', () => keys[keyName] = false);
        }
        bindTouch('b-up', 'up'); bindTouch('b-down', 'down');
        bindTouch('b-left', 'left'); bindTouch('b-right', 'right');

        const jumpBtn = document.getElementById('btn-jump');
        const triggerJump = (e) => {
            if (e) e.preventDefault();
            if (isGrounded) { velocity.y = 0.38; isGrounded = false; }
        };
        jumpBtn.addEventListener('touchstart', triggerJump);
        jumpBtn.addEventListener('click', triggerJump);

        // 리스폰 (사망 시)
        function respawn() {
            player.position.copy(currentRespawnPos);
            velocity.set(0, 0, 0);
        }
        respawn();

        // 메시지 팝업
        function showMessage(text) {
            const overlay = document.getElementById('msg-overlay');
            overlay.innerText = text;
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 1500);
        }

        // ----------------------------------------------------
        // 5. 메인 게임 루프 (Frame Update)
        // ----------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // 시간 업데이트
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('time-val').innerText = elapsed + 's';

            // 1) 캐릭터 이동 조작
            const moveSpeed = 0.15;
            let moveX = 0, moveZ = 0;

            if (keys.up) moveZ -= moveSpeed;
            if (keys.down) moveZ += moveSpeed;
            if (keys.left) moveX -= moveSpeed;
            if (keys.right) moveX += moveSpeed;

            player.position.x += moveX;
            player.position.z += moveZ;

            // 이동 방향으로 캐릭터 회전
            if (moveX !== 0 || moveZ !== 0) {
                const angle = Math.atan2(moveX, moveZ);
                player.rotation.y = angle;

                // 걷기 애니메이션
                walkAnimTimer += 0.2;
                charObj.leftArm.rotation.x = Math.sin(walkAnimTimer) * 0.6;
                charObj.rightArm.rotation.x = -Math.sin(walkAnimTimer) * 0.6;
                charObj.leftLeg.rotation.x = -Math.sin(walkAnimTimer) * 0.6;
                charObj.rightLeg.rotation.x = Math.sin(walkAnimTimer) * 0.6;
            } else {
                // 정지 시 원위치
                charObj.leftArm.rotation.x = 0;
                charObj.rightArm.rotation.x = 0;
                charObj.leftLeg.rotation.x = 0;
                charObj.rightLeg.rotation.x = 0;
            }

            // 2) 회전 장애물 업데이트
            rotatingObstacles.forEach(spinner => {
                spinner.rotation.y += 0.04;
                // 회전 몽둥이와 충돌 검사
                const dist = player.position.distanceTo(spinner.position);
                if (dist < 3.8 && Math.abs(player.position.y - spinner.position.y) < 1.2) {
                    respawn(); // 사망
                }
            });

            // 3) 중력 적용
            velocity.y -= 0.018; // 중력값
            player.position.y += velocity.y;

            // 4) 발판 충돌 처리
            isGrounded = false;
            platforms.forEach(p => {
                if (p.state === 'invisible') return;

                const px = player.position.x;
                const py = player.position.y;
                const pz = player.position.z;

                // AABB 충돌 체크
                if (px >= p.x - p.w/2 - 0.3 && px <= p.x + p.w/2 + 0.3 &&
                    pz >= p.z - p.d/2 - 0.3 && pz <= p.z + p.d/2 + 0.3) {
                    
                    if (py - 0.85 <= p.y + p.h/2 && py >= p.y) {
                        // 킬 블록에 닿음
                        if (p.type === 'kill') {
                            respawn();
                            return;
                        }
                        
                        // 착지
                        player.position.y = p.y + p.h/2 + 0.85;
                        velocity.y = 0;
                        isGrounded = true;

                        // 점프대 밟음
                        if (p.type === 'bounce') {
                            velocity.y = 0.55; // 더 높이 튐
                            isGrounded = false;
                        }

                        // 사라지는 발판 처리
                        if (p.type === 'vanishing' && p.state === 'active') {
                            p.state === 'touched';
                            setTimeout(() => {
                                p.mesh.material.opacity = 0.2;
                                p.state = 'invisible';
                                setTimeout(() => {
                                    p.mesh.material.opacity = 1.0;
                                    p.state = 'active';
                                }, 3000);
                            }, 500);
                        }
                    }
                }
            });

            // 5) 체크포인트 도달검사
            checkPoints.forEach(cp => {
                if (player.position.distanceTo(cp.pos) < 3) {
                    if (currentStageIndex < cp.stageNum) {
                        currentStageIndex = cp.stageNum;
                        currentRespawnPos.copy(cp.pos);
                        cp.flagMat.color.setHex(0x00e676); // 깃발 초록색 변경
                        
                        document.getElementById('stage-val').innerText = currentStageIndex + ' / 5';
                        if (currentStageIndex === 5) {
                            showMessage("🎉 CLEAR! All Stages Passed!");
                        } else {
                            showMessage("CHECKPOINT!");
                        }
                    }
                }
            });

            // 추락 사망
            if (player.position.y < -15) {
                respawn();
            }

            // 6) 3인칭 역동적 카메라 추적
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 5;
            camera.position.z = player.position.z + 9;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

            renderer.render(scene, camera);
        }

        // 반응형 창 크기 조절
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
